# Repository-relative paths. This file is shell configuration.
version_file=.githooks/semver
# Empty for plain text; a unique JSON field name, or a full-line template with {version}.
version_field="semver_version='{version}'"
tag_prefix=v
commit_version=false # Insert [vX.Y.Z] after the subject colon, using tag_prefix.
changelog_exact_commit_message=false # Include full commit messages, including generated version labels.
changelog_file=CHANGELOG.md
changelog_heading='# Changelog\n\nAll notable changes are documented here automatically by git-semver-hooks.'
changelog_remove_extra_headings=true # Remove existing top-level titles and their introductory text when generating the changelog.
# Optional category titles. Empty values omit the corresponding heading.
changelog_breaking_title=''
changelog_features_title=''
changelog_fixes_title=''
changelog_performance_title=''
patch_types='fix perf'
minor_types=feat
allowed_branches=main # Space-separated exact names; empty allows all branches.
auto_continue=true # Resume synchronization automatically once all conflicts are staged.
initial_version=0.0.0
