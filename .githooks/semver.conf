# Repository-relative paths. This file is shell configuration.
version_file=VERSION
version_field= # Empty for plain text; JSON field must be unique and on its own line.
tag_prefix=v
changelog_file=CHANGELOG.md
changelog_heading='# Changelog\n\nAll notable changes to this project are documented here.'
# Optional category titles. Empty values omit the corresponding heading.
changelog_breaking_title=''
changelog_features_title=''
changelog_fixes_title=''
changelog_performance_title=''
patch_types='fix perf'
minor_types=feat
allowed_branches=main # Space-separated exact names; empty allows all branches.
auto_continue=true # Resume synchronization automatically once all conflicts are staged.
initial_version=0.0.0
